name: Stock Monitor

on:
  workflow_dispatch:

concurrency:
  group: pokemon-stock-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run stock monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_cardsnation.py

      - name: Save stock state
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "No state.json exists yet."
            exit 0
          fi

          git add -f state.json

          if git diff --cached --quiet -- state.json; then
            echo "State unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Pokémon stock state"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
